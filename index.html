<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://ntfy.sh">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg1:#CDE3F2;--bg2:#BDD7EB;--card:#DCEAF6;--tile:#F4F9FD;--line:#9BBDD8;--green:#16A34A;--t:#082647;--t2:#31577D;--mut:#5C7790;--nav:#D5E6F3;--on:#fff;--bad:#DC2626;--warn:#D97706}
:root[data-theme=dark]{--bg1:#0A1628;--bg2:#0D1B2A;--card:#162032;--tile:#1D2940;--line:#2A3A52;--green:#4ADE80;--t:#E2E8F0;--t2:#94A3B8;--mut:#64748B;--nav:#0F1923;--on:#06210f;--bad:#EF4444;--warn:#FBBF24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(var(--bg1),var(--bg2)) fixed;color:var(--t);font-family:-apple-system,Roboto,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
main{max-width:480px;margin:0 auto;padding:10px 14px calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 8px}
.title{font-size:21px;font-weight:700}.sub{font-size:12px;color:var(--mut)}
.round{width:40px;height:40px;border-radius:50%;background:var(--tile);display:flex;align-items:center;justify-content:center;color:var(--green);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px}
.hero{padding:0 0 10px;overflow:hidden;position:relative}
.strip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 0 14px;font-size:13px;color:var(--t2)}
.strip .win{display:flex;gap:6px;align-items:center;font-weight:600}.strip .win.open{color:var(--warn)}
.badge{border-radius:999px;padding:6px 14px;font-weight:700;background:var(--tile);color:var(--mut)}
.badge.on{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.hero img{display:block;width:58%;max-width:260px;margin:12px auto 10px}
.pin{position:absolute;right:12px;top:48px}
.figs{display:flex;justify-content:space-around;font-size:15px}.figs span{display:flex;gap:6px;align-items:center;color:var(--t2)}.figs b{color:var(--t)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--t2);margin-bottom:8px}
.link{color:var(--green);font-size:14px;padding:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px}
.buttons{display:flex;gap:8px;margin-bottom:10px}.buttons .pill{margin:0;font-size:14px;padding:11px 6px}
.cmd{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;line-height:1.15;text-align:center;color:var(--t2);touch-action:manipulation}
.dot{width:52px;height:52px;border-radius:18px;background:var(--tile);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px}
.cmd:active .dot,.dot.on{background:var(--green);color:var(--on)}
.cmd.flip .dot{animation:flip .55s ease}.cmd.flip>span:last-child{animation:fade .55s ease}
@keyframes flip{0%{transform:rotateY(90deg) scale(.85)}60%{transform:rotateY(-12deg) scale(1.06)}100%{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cmd.busy .dot{animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.35}}
.editing .cmd{touch-action:none}
.mark{position:absolute;top:-6px;right:calc(50% - 36px);width:22px;height:22px;border-radius:50%;color:#fff;background:var(--bad);font-size:17px;line-height:20px;font-style:normal}
.mark.add{background:var(--green)}
.cmd.drag{opacity:.4}
.clim{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px;touch-action:pan-y}
.clim .fill{position:absolute;inset:0;width:0;background:color-mix(in srgb,var(--green) 55%,transparent)}
.clim.hold .fill{width:100%;transition:width .9s linear}
.clim>*:not(.fill){position:relative}
.sw{width:56px;height:56px;border-radius:18px;background:var(--tile);color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.sw.on{background:var(--green);color:var(--on)}
.clim b{display:block;font-size:18px}.clim small{color:var(--mut);font-size:13px}
small{font-size:12px;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}.tab.on{color:var(--green);font-weight:700}
.center{text-align:center}
.temp{display:flex;align-items:center;justify-content:space-around;margin:4px 0 10px}.temp b{font-size:62px;font-weight:300}
.big{width:56px;height:56px;font-size:30px}
.pill{display:flex;gap:8px;justify-content:center;align-items:center;width:100%;border-radius:14px;padding:12px;font-weight:700;background:var(--tile);color:var(--green)}
.pill.on{background:var(--green);color:var(--on)}.pill.bad{color:var(--bad)}
.steps{display:flex;gap:5px}.steps button{flex:1;padding:10px 0;border-radius:10px;background:var(--tile);color:var(--t2);font-size:14px}.steps button.on{background:var(--green);color:var(--on);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.toggle{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;margin:0;font-size:13.5px}.toggle.on{border-color:var(--green)}.toggle.on small{color:var(--green)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:0}
select,input[type=text]{font:inherit;font-size:16px;background:var(--tile);color:var(--t);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:130px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:85vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:10px}.sheet .pill{margin-top:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:var(--t);color:var(--bg1);border-radius:14px;padding:12px 14px;font-size:14px;text-align:center;z-index:20}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div class="shade" id="shade" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

    if (c === 'ac_on') car.ac = 1; if (c === 'ac_off') car.ac = 0;
    if (c === 'defrost_on') car.defrost = 1; if (c === 'defrost_off') car.defrost = 0;
    if (c.startsWith('temp_')) car.temp = +c.slice(5); if (c.startsWith('fan_')) car.fan = +c.slice(4);
    if (c === 'win_open') car.win = [100,100,100,100]; if (c === 'win_close') car.win = [0,0,0,0]; if (c === 'win_vent') car.win = [10,10,10,10];
    if (c.startsWith('seat_d')) car.seatD = +c.slice(6); if (c.startsWith('seat_p')) car.seatP = +c.slice(6);
  });
  remember(car); online = true;
  const res = {}; cmds.forEach(c => res[c] = true);
  return new Promise(r => setTimeout(() => { render(); r({ res }); }, 600));
}

// ---------- running ----------
async function run(name, cmds, tag) {
  if (!pairing.k) return toast('Пульт не связан с машиной: откройте его из бота');
  if (online === false) { ping(true); return toast('Машина не в сети'); }
  if (tag) { if (busy.has(tag)) return; busy.add(tag); render(); }
  haptic('light');
  const a = await request(cmds);
  if (tag) busy.delete(tag);
  let text, ok = false;
  if (!a) { text = 'Машина не ответила'; online = false; }
  else if (a.failed) text = 'Нет интернета на телефоне';
  else {
    const bad = Object.entries(a.res || {}).filter(([, v]) => v !== true);
    ok = !bad.length;
    text = ok ? 'Выполнено' : bad.map(([id, why]) => `${LABELS[id] || id}: ${why}`).join('; ');
  }
  journal = [{ t: Date.now(), name, text }, ...journal].slice(0, 40); store.set('journal', journal);
  toast(`${name}: ${text}`); haptic(ok ? 'success' : 'error'); render();
}
function haptic(kind) {
  try { if (kind === 'light' || kind === 'medium') TG.HapticFeedback.impactOccurred(kind); else TG.HapticFeedback.notificationOccurred(kind); } catch (e) {}
}
let toastTimer;
function toast(text) {
  $('toast').textContent = text; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, 4000);
}
function sheet(html) { $('sheet').innerHTML = html; $('shade').hidden = false; }
function closeSheet() { $('shade').hidden = true; }
$('shade').addEventListener('click', e => { if (e.target === $('shade')) closeSheet(); });

function press(it) {
  if (it.find) return showPlace();
  const f = face(it);
  run(f.name, it.scenario ? scenarioCommands(it.id) : f.cmds, it.id);
}
function showPlace() {
  if (!car || car.lat === undefined) { ping(true); return toast('Машина ещё не передала место'); }
  const map = `https://maps.google.com/?q=${car.lat},${car.lon}`;
  sheet(`<h3>Где машина</h3><small>По данным на ${when(car.ts)}</small>
    <button class="pill on" id="map">Открыть на карте</button><button class="pill" id="share">Поделиться</button>`);
  $('map').onclick = () => openLink(map);
  $('share').onclick = () => {
    const url = `https://t.me/share/url?url=${encodeURIComponent(map)}&text=${encodeURIComponent('Моя машина здесь')}`;
    if (TG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, '_blank');
  };
}
const openLink = url => { if (TG && TG.openLink) TG.openLink(url); else window.open(url, '_blank'); };

// ---------- views ----------
const when = ts => {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('ru', { hour:'2-digit', minute:'2-digit' });
  return d.toDateString() === now.toDateString() ? `сегодня в ${time}` : `${d.toLocaleDateString('ru', { day:'numeric', month:'short' })} в ${time}`;
};
const val = (v, unit) => v === undefined || v === null ? '—' : `${v.toLocaleString('ru')}${unit}`;
function windowsText() {
  if (!car || !car.win) return { text:'Окна: нет данных', open:false };
  const open = car.win.filter(w => w > 0);
  return open.length ? { text:'Окна открыты', open:true } : { text:'Все окна закрыты', open:false };
}
const head = (title, back) => `<div class="head">${back ? '<button class="round" data-act="back">‹</button>' : ''}
  <div style="flex:1;margin-left:${back ? 12 : 0}px"><div class="title">${title}</div>
  <div class="sub">${!pairing.k ? 'Откройте пульт кнопкой из бота' : car ? 'Обновлено: ' + when(car.ts) : 'Данных ещё нет'}</div></div></div>`;
const shown = {};   // the state each two-way card was last drawn in, to animate its change
const tile = (it, mark) => {
  const f = face(it);
  const changed = it.toggle && it.id in shown && shown[it.id] !== f.on;
  if (it.toggle) shown[it.id] = f.on;
  return `<button class="cmd${busy.has(it.id) ? ' busy' : ''}${changed ? ' flip' : ''}" data-item="${it.id}">
  ${mark || ''}<span class="dot${f.on ? ' on' : ''}">${ic(f.icon, 28)}</span><span>${esc(f.name)}</span></button>`;
};

function viewMain() {
  const w = windowsText();
  const on = car && car.ac === 1;
  const last = [climate.fan ? `обдув ${climate.fan}` : '', car && car.in !== undefined ? `в салоне ${car.in}°` : ''].filter(Boolean).join(' · ');
  return head('BYD Dolphin') + `
  <div class="card hero">
    <div class="strip"><span class="win${w.open ? ' open' : ''}">${ic(w.open ? 'windown' : 'winup', 20)} ${w.text}</span>
      <button class="badge${online ? ' on' : ''}" data-act="ping">${online === null ? '… Проверяю' : online ? '● Онлайн' : '○ Не в сети'}</button></div>
    <button class="round pin" data-act="place" aria-label="Где машина">${ic('pin', 22)}</button>
    <img src="car.png" alt="">
    <div class="figs"><span>${ic('bat', 20)}<b>${val(car && car.soc, ' %')}</b></span><span>${ic('road', 20)}<b>${val(car && car.range, ' км')}</b></span><span>${ic('odo', 20)}<b>${val(car && car.odo, ' км')}</b></span></div>
  </div>
  <div class="card"><div class="row"><span>Быстрые команды</span></div>
    <div class="grid">${mainIds.map(id => tile(item(id))).join('')}</div></div>
  <button class="card clim" id="clim"><span class="fill"></span>
    <span class="sw${on ? ' on' : ''}">${on ? 'ON' : 'OFF'}</span>
    <span><b>Климат${climate.temp ? ` · ${climate.temp}°` : ''}</b><small>${last}</small></span></button>`;
}
// «order» moves the tiles of this tab; «main» chooses what the main screen shows, and in which order
function viewCommands() {
  if (editing === 'main') {
    const rest = order.filter(id => !mainIds.includes(id));
    return head('Главный экран') + `<div class="card editing">
        <div class="row"><span>На главном: ${mainIds.length} из ${MAIN_MAX}</span><button class="link" data-act="done">Готово</button></div>
        <div class="grid" id="drag">${mainIds.map(id => tile(item(id), `<i class="mark" data-mark="${id}">−</i>`)).join('')}</div></div>
      <div class="card"><div class="row"><span>Можно добавить</span></div>
        <div class="grid">${rest.map(id => tile(item(id), `<i class="mark add" data-mark="${id}">+</i>`)).join('') || '<small>Всё уже на главном</small>'}</div></div>
      <div class="card"><small>Перетаскивайте значки, чтобы поменять порядок. «−» убирает с главного, «+» добавляет.</small></div>`;
  }
  const moving = editing === 'order';
  return head('Команды') + `<div class="buttons">
      <button class="pill${moving ? ' on' : ''}" data-act="${moving ? 'done' : 'order'}">${moving ? 'Готово' : 'Изменить'}</button>
      <button class="pill" data-act="main-edit">Главный экран</button></div>
    <div class="card${moving ? ' editing' : ''}"><div class="grid" id="drag">${order.map(id => tile(item(id))).join('')}</div></div>
    ${moving ? '<div class="card"><small>Перетащите значок на нужное место.</small></div>' : ''}`;
}
function viewClimate() {
  const c = car || {};
  const temp = climate.temp || 22, fan = climate.fan || 1, on = c.ac === 1;
  const choice = (list, current) => list.map(([id, label, v]) => `<button class="${current === v ? 'on' : ''}" data-run="${id}">${label}</button>`).join('');
  const toggle = (name, isOn, onId, offId, icon) => `<button class="card toggle${isOn ? ' on' : ''}" data-run="${isOn ? offId : onId}">${ic(icon)}<span>${name}</span><small>${isOn ? 'включено' : 'выключено'}</small></button>`;
  return head('Климат', true) + `
  <div class="card center"><small>${c.in !== undefined ? `Температура в салоне ${c.in}°` : 'Климат'}</small>
    <div class="temp"><button class="round big" data-act="t-">−</button><b>${temp}°</b><button class="round big" data-act="t+">+</button></div>
    <button class="pill${on ? ' on' : ''}" data-run="${on ? 'ac_off' : 'ac_on'}">${on ? 'Выключить климат' : 'Включить климат'}</button></div>
  <div class="card"><div class="row"><span>${ic('fan', 20)} Скорость обдува</span><b>${fan}</b></div>
    <div class="steps">${choice([1,2,3,4,5,6,7].map(n => ['fan_' + n, n, n]), fan)}</div></div>
  <div class="card"><div class="row"><span>Куда дует</span></div><div class="steps">${choice([['flow_face','В лицо',0],['flow_feet','В ноги',1],['flow_all','Везде',2]], -1)}</div></div>
  <div class="two">${toggle('Воздух внутри', c.circ === 1, 'air_in', 'air_out', 'recirc')}${toggle('Обдув лобового', c.defrost === 1, 'defrost_on', 'defrost_off', 'defr')}</div>
  <div class="two">${toggle('Климат авто', c.auto === 1, 'auto_on', 'auto_off', 'fan')}<span></span></div>
  <div class="card"><div class="row"><span>${ic('seat', 20)} Подогрев водителя</span></div><div class="steps">${choice([['seat_d0','Выкл',0],['seat_d1','1',1],['seat_d2','2',2]], c.seatD)}</div>
    <div class="row" style="margin-top:12px"><span>${ic('seat', 20)} Подогрев пассажира</span></div><div class="steps">${choice([['seat_p0','Выкл',0],['seat_p1','1',1],['seat_p2','2',2]], c.seatP)}</div></div>`;
}
const options = (list, current) => list.map(([v, label]) => `<option value="${v}"${String(v) === String(current) ? ' selected' : ''}>${label}</option>`).join('');
function viewScenario() {
  const c = scenarios[scenario], it = item(scenario);
  const choice = (key, list) => list.map(([v, label]) => `<button class="${c[key] === v ? 'on' : ''}" data-key="${key}" data-value="${v}">${label}</button>`).join('');
  return head(it.name, true) + `
  <div class="card center"><small>Температура</small>
    <div class="temp"><button class="round big" data-act="s-">−</button><b>${c.temp}°</b><button class="round big" data-act="s+">+</button></div></div>
  <div class="card"><div class="row"><span>${ic('fan', 20)} Скорость обдува</span><b>${c.fan}</b></div>
    <div class="steps">${choice('fan', [1,2,3,4,5,6,7].map(n => [n, n]))}</div></div>
  <div class="card"><div class="row"><span>${ic('vent', 20)} Потоки воздуха</span></div>
    <div class="steps">${choice('flow', [['flow_face','В лицо'],['flow_feet','В ноги'],['flow_all','Везде']])}</div></div>
  <div class="card"><div class="row"><span>${ic('seatheat', 20)} Подогрев водителя</span></div><div class="steps">${choice('seatD', [[0,'Выкл'],[1,'1'],[2,'2']])}</div>
    <div class="row" style="margin-top:12px"><span>${ic('seatheat', 20)} Подогрев пассажира</span></div><div class="steps">${choice('seatP', [[0,'Выкл'],[1,'1'],[2,'2']])}</div></div>
  <div class="card"><div class="row"><span>${ic('mirrorheat', 20)} Обогрев зеркал</span></div><div class="steps">${choice('mirror', [[0,'Выкл'],[1,'Вкл']])}</div></div>`;
}
function viewSettings() {
  const level = key => [1, 2].map(n => `<button class="${+settings[key] === n ? 'on' : ''}" data-level="${key}" data-value="${n}">Уровень ${n}</button>`).join('');
  const row = id => { const c = scenarios[id]; return `<button class="card clim" data-scenario="${id}"><span class="sw">${ic(item(id).icon, 30)}</span>
    <span><b>${item(id).name}</b><small>${c.temp}° · обдув ${c.fan}${c.seatD || c.seatP ? ' · подогрев сидений' : ''}${c.mirror ? ' · зеркала' : ''}</small></span></button>`; };
  return head('Настройки') + `
  <div class="row" style="margin:4px 4px 8px"><span>Сценарии</span></div>${row('winter')}${row('summer')}
  <div class="card"><div class="row"><span>${ic('seatheat', 20)} Подогрев по умолчанию: водитель</span></div>
    <div class="steps">${level('seatD')}</div>
    <div class="row" style="margin-top:12px"><span>${ic('seatheat', 20)} Пассажир</span></div><div class="steps">${level('seatP')}</div></div>
  <div class="card"><label class="line">Тема<select data-set="theme">${options([['auto','как в Telegram'],['light','светлая'],['dark','тёмная']], settings.theme)}</select></label>
    <div class="line">Связь с машиной<span>${pairing.k ? (online ? 'в сети' : 'настроена') : 'не настроена'}</span></div></div>
  <div class="card"><div class="row"><span>Журнал команд</span>${journal.length ? '<button class="link" data-act="clear">Очистить</button>' : ''}</div>
    ${journal.length ? journal.map(j => `<div class="line"><span>${esc(j.name)}<br><small>${when(j.t)}</small></span><small style="text-align:right">${esc(j.text)}</small></div>`).join('') : '<small>Пока пусто</small>'}</div>`;
}

function applyTheme() {
  const dark = settings.theme === 'dark' || (settings.theme === 'auto' &&
    (TG && TG.platform !== 'unknown' ? TG.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { TG.setHeaderColor(dark ? '#0A1628' : '#CDE3F2'); TG.setBackgroundColor(dark ? '#0A1628' : '#CDE3F2'); } catch (e) {}
}
let holding = false, dragging = null, renderLater = false;
function render() {
  // a redraw in the middle of a long press or a drag would drop the finger's element
  if (holding || dragging) { renderLater = true; return; }
  applyTheme();
  $('app').innerHTML = { main: viewMain, commands: viewCommands, climate: viewClimate, settings: viewSettings, scenario: viewScenario }[tab]();
  $('tabs').innerHTML = [['main','car','Машина'], ['commands','grid','Команды'], ['settings','gear','Настройки']]
    .map(([id, icon, label]) => `<button class="tab${tab === id || (id === 'main' && tab === 'climate') || (id === 'settings' && tab === 'scenario') ? ' on' : ''}" data-tab="${id}">${ic(icon, id === 'main' ? 28 : 24)}<span>${label}</span></button>`).join('');
  if (tab === 'main') bindClimate();
  if (tab === 'commands' && editing) bindDrag();
  try { if (tab === 'climate' || tab === 'scenario' || editing === 'main') TG.BackButton.show(); else TG.BackButton.hide(); } catch (e) {}
}
function go(next) { tab = next; editing = null; render(); window.scrollTo(0, 0); }
function back() { if (tab === 'scenario') go('settings'); else if (tab === 'commands') go('commands'); else go('main'); }

// short press: climate settings; held for 0.9 s (the bar fills left to right): on with the saved values, or off
const HOLD_MS = 900;
function bindClimate() {
  const bar = $('clim');
  let timer = null, x = 0, y = 0, fired = false, cancelled = false;
  const stop = () => {
    clearTimeout(timer); timer = null; holding = false; bar.classList.remove('hold');
    if (renderLater) { renderLater = false; render(); }
  };
  bar.onpointerdown = e => {
    x = e.clientX; y = e.clientY; fired = false; cancelled = false; holding = true;
    void bar.offsetWidth; bar.classList.add('hold');
    timer = setTimeout(() => {
      fired = true; haptic('medium'); stop();
      const on = car && car.ac === 1;
      // only the power: the car keeps its own temperature and fan
      run(on ? 'Климат выключить' : 'Климат включить', [on ? 'ac_off' : 'ac_on'], 'clim');
    }, HOLD_MS);
  };
  bar.onpointermove = e => { if (timer && Math.hypot(e.clientX - x, e.clientY - y) > 12) { cancelled = true; stop(); } };
  bar.onpointercancel = () => { cancelled = true; stop(); };
  bar.onpointerup = () => { const short = !fired && !cancelled && timer !== null; stop(); if (short) go('climate'); };
  bar.oncontextmenu = e => e.preventDefault();
}
function bindDrag() {
  const grid = $('drag');
  let start = null;
  grid.onpointerdown = e => {
    const el = e.target.closest('[data-item]');
    if (!el || e.target.dataset.mark) return;
    start = { el, x: e.clientX, y: e.clientY };
    grid.setPointerCapture(e.pointerId);
  };
  grid.onpointermove = e => {
    if (!start) return;
    if (!dragging && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) { dragging = start.el; dragging.classList.add('drag'); }
    if (!dragging) return;
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const target = over && over.closest('[data-item]');
    if (target && target !== dragging && target.parentNode === grid) {
      const kids = [...grid.children];
      grid.insertBefore(dragging, kids.indexOf(dragging) < kids.indexOf(target) ? target.nextSibling : target);
    }
  };
  grid.onpointerup = grid.onpointercancel = () => {
    const moved = dragging;
    start = null; dragging = null; renderLater = false;
    if (!moved) return;
    const now = [...grid.children].map(el => el.dataset.item);
    if (editing === 'main') { mainIds = now; store.set('main', mainIds); } else { order = now; store.set('order', order); }
    render();
  };
}

// ---------- events ----------
let tempTimer = null;
function stepTemp(delta) {
  climate.temp = Math.max(16, Math.min(32, (climate.temp || 22) + delta)); render();
  clearTimeout(tempTimer);
  const next = climate.temp;
  tempTimer = setTimeout(() => run(`Температура ${next}°`, ['temp_' + next]), 900);
}
function setScenario(key, value) {
  scenarios = Object.assign({}, scenarios, { [scenario]: Object.assign({}, scenarios[scenario], { [key]: value }) });
  store.set('scenarios', scenarios); render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-mark],[data-item],[data-run],[data-key],[data-scenario],[data-level]');
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.level) { settings[t.dataset.level] = +t.dataset.value; store.set('settings', settings); return render(); }
  if (t.dataset.mark) {
    const id = t.dataset.mark;
    if (mainIds.includes(id)) mainIds = mainIds.filter(x => x !== id);
    else if (mainIds.length >= MAIN_MAX) return toast(`На главном помещается ${MAIN_MAX}: сначала уберите лишнее`);
    else mainIds = mainIds.concat(id);
    store.set('main', mainIds); return render();
  }
  if (t.dataset.scenario) { scenario = t.dataset.scenario; return go('scenario'); }
  if (t.dataset.key) return setScenario(t.dataset.key, t.dataset.key === 'flow' ? t.dataset.value : +t.dataset.value);
  if (t.dataset.run) return run(LABELS[t.dataset.run], [t.dataset.run], t.dataset.run);
  if (t.dataset.item) { if (!editing) press(item(t.dataset.item)); return; }
  const act = t.dataset.act;
  if (act === 'back') back();
  if (act === 'ping') { online = null; render(); ping(true); }
  if (act === 'place') showPlace();
  if (act === 'order') { editing = 'order'; render(); }
  if (act === 'main-edit') { editing = 'main'; render(); }
  if (act === 'done') { editing = null; render(); }
  if (act === 'clear') { journal = []; store.set('journal', journal); render(); }
  if (act === 't-') stepTemp(-1);
  if (act === 't+') stepTemp(1);
  if (act === 's-' || act === 's+') setScenario('temp', Math.max(16, Math.min(32, scenarios[scenario].temp + (act === 's+' ? 1 : -1))));
});
document.addEventListener('change', e => {
  const key = e.target.dataset && e.target.dataset.set;
  if (!key) return;
  settings[key] = e.target.value;
  store.set('settings', settings); render();
});

// ---------- start ----------
try {
  TG.ready(); TG.expand();
  if (TG.isVersionAtLeast('7.7')) TG.disableVerticalSwipes();
  TG.onEvent('themeChanged', render);
  TG.BackButton.onClick(back);
  if (TG.isVersionAtLeast('6.9')) TG.CloudStorage.getItems(['order', 'main', 'scenarios', 'settings'], (err, saved) => {
    if (err || !saved) return;
    // a phone that has nothing of its own yet takes what was saved from another
    const mine = k => saved[k] && localStorage.getItem('dolphin.' + k) === null ? JSON.parse(saved[k]) : null;
    order = mine('order') ? ordered(mine('order')) : order;
    mainIds = mine('main') || mainIds;
    scenarios = Object.assign({}, scenarios, mine('scenarios') || {});
    settings = mine('settings') || settings;
    render();
  });
} catch (e) {}
if (DEMO) { pairing = { k:'demo', t:'demo' }; demo([]); }
render();
listen();
if (!DEMO) ping(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { listen(); ping(); } });
// the relay has a daily message limit, so the open page asks only now and then
setInterval(() => { if (!document.hidden && !DEMO) ping(); }, 180000);
</script>
</body>
